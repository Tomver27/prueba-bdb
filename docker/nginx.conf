# Proxy inverso hacia app:3000 (ver docs/DEPLOYMENT.md).
#
# Sin dominio propio (demo rápida — limitación conocida y aceptada, ver docs/DEPLOYMENT.md y
# README.md): se sirve solo por HTTP. El bloque HTTPS con Let's Encrypt queda comentado abajo,
# listo para descomentar cuando haya un dominio y certificados reales.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Next.js App Router soporta respuestas en streaming — sin buffering para no romperlas
  # (ver node_modules/next/dist/docs/.../self-hosting.md, "Streaming and Suspense").
  proxy_buffering off;

  upstream nextjs_app {
    server app:3000;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://nextjs_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Accel-Buffering no;
    }
  }

  # --- Con dominio propio + TLS (Let's Encrypt vía certbot, ver docs/DEPLOYMENT.md) ---
  # Reemplazar "tu-dominio.com" y montar el volumen de certificados en docker-compose.yml.
  #
  # server {
  #   listen 80;
  #   server_name tu-dominio.com;
  #   location /.well-known/acme-challenge/ { root /var/www/certbot; }
  #   location / { return 301 https://$host$request_uri; }
  # }
  #
  # server {
  #   listen 443 ssl;
  #   server_name tu-dominio.com;
  #   ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
  #
  #   location / {
  #     proxy_pass http://nextjs_app;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection "upgrade";
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_set_header X-Accel-Buffering no;
  #   }
  # }
}
